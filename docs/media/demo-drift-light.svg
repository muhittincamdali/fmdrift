<text class="t" x="20" y="257" style="animation-delay:5.10s"><tspan fill="#0B1F33">       </tspan><tspan fill="#0058D4">How to fix: </tspan><tspan fill="#0B1F33">The guardrails flagged the prompt or the response, so the model threw </tspan></text>
<text class="t" x="20" y="276" style="animation-delay:5.13s"><tspan fill="#0B1F33">         guardrailViolation instead of answering. If a decline is the expected outcome, check for it </tspan></text>
<text class="t" x="20" y="295" style="animation-delay:5.17s"><tspan fill="#0B1F33">         with `refusal: true`; if the prompt transforms text a person supplied (summarize, rewrite, </tspan></text>
<text class="t" x="20" y="314" style="animation-delay:5.20s"><tspan fill="#0B1F33">         tag), try `guardrails: permissiveContentTransformations`, which applies to text responses only.</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:5.24s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://developer.apple.com/documentation/foundationmodels/systemlanguagemodel/guardrails/permissivecontenttransformations</tspan></text>
