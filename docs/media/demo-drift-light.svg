<text class="t" x="20" y="656" style="animation-delay:5.83s"><tspan fill="#0B1F33">            </tspan><tspan fill="#0058D4">How to fix: </tspan><tspan fill="#0B1F33">The case passed before its prompt, instructions, options or schema changed, and </tspan></text>
