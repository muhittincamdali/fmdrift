name: Lint

# swift-format with the rules in .swift-format, as warnings-are-errors. The toolchain's own
# `swift format` is used, so the result matches a local `swift format lint --strict`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift Examples/LibraryUsage
